<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070d">
  <meta name="description" content="双色球、大乐透、福彩3D、快乐8、排列五公式投票选号：270 个双色球/大乐透公式、94 个数字位置公式、173 个快乐8公式，附完整走势图。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="数彩实验室">
  <meta name="format-detection" content="telephone=no">
  <title>数彩实验室 · 双色球/大乐透/3D/快乐8/排列五公式投票选号</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-row">
        <div class="brand">
          <div class="logo" aria-hidden="true">∑</div>
          <div>
            <h1>数彩实验室</h1>
            <p>公式投票 · 走势分析</p>
          </div>
        </div>
        <div class="top-actions">
          <span class="data-pill"><span class="dot"></span><span id="data-date">加载中</span></span>
          <button class="icon-btn" id="refresh-btn" type="button" title="检查更新（清除缓存并获取最新版本）" aria-label="检查更新">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4.5V10h-5.5"/></svg>
          </button>
        </div>
      </div>
      <div class="seg game-seg" id="game-seg" role="tablist" aria-label="彩种切换">
        <button data-game="ssq" class="on" role="tab">双色球</button>
        <button data-game="dlt" role="tab">大乐透</button>
        <button data-game="fc3d" role="tab">3D</button>
        <button data-game="kl8" role="tab">快乐8</button>
        <button data-game="pl5" role="tab">排列五</button>
      </div>
    </header>

    <main id="view" aria-live="polite">
      <div class="card" style="margin-top:16px">
        <div class="skeleton" style="height:120px"></div>
      </div>
    </main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="主导航">
    <button class="tab on" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>
      <span>推荐</span>
    </button>
    <button class="tab" data-tab="trend">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M4 15l5-5 4 3 6-7"/><path d="M4 19h16"/></svg>
      <span>走势</span>
    </button>
    <button class="tab" data-tab="formulas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h7"/><path d="M9.5 6l4.5 12"/><path d="M14.5 6H19"/><path d="M6 18h6"/></svg>
      <span>公式</span>
    </button>
    <button class="tab" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
      <span>历史</span>
    </button>
    <button class="tab" data-tab="about">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 11v5"/><circle cx="12" cy="8" r=".9" fill="currentColor"/></svg>
      <span>关于</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status"></div>

  <noscript>
    <div class="app" style="padding-top:80px">
      <div class="card">需要开启 JavaScript 才能使用公式投票与走势图。</div>
    </div>
  </noscript>

  <script src="assets/core.js"></script>
  <script src="assets/formulas.js"></script>
  <script src="assets/charts.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
